<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>虹のスライドパズル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column setup card (two columns on wide screens) → full-height game screen with HUD / stage / zoom bar */
:root {
  --bg: #EDEFF4;
  --surface: #FFFFFF;
  --ink: #181B24;
  --muted: #5A6172;
  --line: #D3D8E3;
  --accent: #3239C8;
  --accent-ink: #FFFFFF;
  --tray: #D3D9E5;
  --stage: #E2E6EE;
  --scrim: rgba(18, 20, 28, .55);
  --danger: #B42318;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --spectrum: linear-gradient(90deg, hsl(0 82% 58%), hsl(40 88% 55%), hsl(70 80% 50%), hsl(130 62% 46%), hsl(190 75% 46%), hsl(235 72% 60%), hsl(300 70% 58%));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101219; --surface: #1A1D27; --ink: #EBEDF3; --muted: #9BA2B4; --line: #2C3140;
    --accent: #8C92FF; --accent-ink: #0E1020; --tray: #07080C; --stage: #151821;
    --scrim: rgba(0, 0, 0, .62); --danger: #FF8A7A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101219; --surface: #1A1D27; --ink: #EBEDF3; --muted: #9BA2B4; --line: #2C3140;
  --accent: #8C92FF; --accent-ink: #0E1020; --tray: #07080C; --stage: #151821;
  --scrim: rgba(0, 0, 0, .62); --danger: #FF8A7A; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-inline: 16px; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body.playing { overflow: hidden; overscroll-behavior: none; }
*, *::before, *::after { box-sizing: inherit; }
button, input { font: inherit; color: inherit; }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: .55em 1.15em; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  transition: transform .08s ease, background-color .15s ease, border-color .15s ease;
  touch-action: manipulation; user-select: none;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 2.6em; height: 2.6em; padding: 0; font-size: 1em; line-height: 1; }
.btn.big { font-size: 1.15rem; padding: .8em 1em; width: 100%; letter-spacing: .2em; }
.btn.small { font-size: .9rem; padding: .45em 1em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.link { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }

/* ---------- start screen ---------- */
.start {
  max-width: 880px; margin: 0 auto; padding-block: 28px 40px;
  display: grid; gap: 24px; align-content: start; min-height: 100%;
}
.brand { display: grid; gap: 10px; }
.brand h1 {
  font-family: var(--f-display); font-weight: 400; margin: 0;
  font-size: clamp(2rem, 8vw, 2.9rem); line-height: 1.15; letter-spacing: .02em; text-wrap: balance;
}
.spectrum { height: 10px; border-radius: 5px; background: var(--spectrum); max-width: 320px; }
.lede { margin: 0; color: var(--muted); max-width: 36em; }
.startBody { display: grid; gap: 24px; }
@media (min-width: 760px) {
  .startBody { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 40px; }
}
.previewWrap { display: grid; gap: 8px; justify-items: center; }
.previewBox {
  width: min(100%, 340px); aspect-ratio: 1; max-width: 100%;
  background: var(--tray); border-radius: 16px; padding: 6px;
}
#preview { width: 100%; height: 100%; display: block; }
.cap { margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }

.setup {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px; display: grid; gap: 18px; min-width: 0;
}
.field { display: grid; gap: 8px; }
.label { font-size: .78rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper input {
  width: 6.5em; min-width: 0; text-align: center; font-family: var(--f-mono); font-size: 1.4rem; font-weight: 700;
  padding: .3em .4em; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  font-variant-numeric: tabular-nums;
}
.stepper input[aria-invalid="true"] { border-color: var(--danger); }
.stepper .times { font-family: var(--f-mono); color: var(--muted); font-size: 1.05rem; }
.note { margin: 0; font-size: .85rem; color: var(--muted); }
.note.warn { color: var(--danger); }

.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track {
  flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line);
  position: relative; transition: background-color .15s ease;
}
.track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s ease;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 2px; }

.imgRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.imgName { overflow-wrap: anywhere; }

/* ---------- game screen ---------- */
.game { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px 12px; }
.hud { display: grid; grid-template-columns: auto 1fr 1fr; align-items: center; gap: 12px; }
.stat { display: grid; justify-items: end; line-height: 1.2; }
.stat .k { font-size: .72rem; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-mono); font-weight: 700; font-size: clamp(1.2rem, 5vw, 1.6rem); font-variant-numeric: tabular-nums; }
.stage {
  flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden; background: var(--stage);
}
#board { position: absolute; inset: 0; display: block; touch-action: none; cursor: pointer; }
.hint {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); margin: 0;
  background: var(--surface); color: var(--muted); border: 1px solid var(--line);
  padding: 4px 12px; border-radius: 999px; font-size: .8rem; white-space: nowrap; pointer-events: none;
  max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis;
}
.zoomBar { display: flex; align-items: center; gap: 10px; }
.zoomBar input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 32px; }
.pct { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); min-width: 4.2em; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- modals ---------- */
.modal {
  position: fixed; inset: 0; z-index: 10; background: var(--scrim);
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
.sheet {
  background: var(--surface); border-radius: 20px; padding: 22px; width: min(100%, 440px);
  display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); margin: auto;
}
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; line-height: 1.25; text-wrap: balance; }
.cropBox { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--stage); position: relative; }
#cropCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.cropZoomRow { display: flex; align-items: center; gap: 10px; }
.cropZoomRow input { flex: 1; min-width: 0; accent-color: var(--accent); }
.cropZoomRow span { font-size: .8rem; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 140px; }

.clear { text-align: center; }
.clear .eyebrow { margin: 0; font-family: var(--f-mono); color: var(--muted); font-size: .85rem; letter-spacing: .1em; }
.clear h2 { font-size: 2.2rem; }
.clear .bar { height: 8px; border-radius: 4px; background: var(--spectrum); width: 60%; margin: -4px auto 0; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.results div { background: var(--bg); border-radius: 12px; padding: 10px; display: grid; gap: 2px; }
.results dt { font-size: .72rem; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.results dd { margin: 0; font-family: var(--f-mono); font-weight: 700; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.points { display: grid; gap: 0; justify-items: center; }
.points .k { font-size: .72rem; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.points .pv { font-family: var(--f-display); font-size: clamp(2.4rem, 12vw, 3.2rem); line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.best { font-size: .85rem; font-weight: 700; color: var(--muted); }
.best.new { color: var(--accent); }
.formula { margin: 0; font-size: .78rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .btn, .track, .track::after { transition: none; }
}
</style>

<main id="start" class="start">
  <header class="brand">
    <h1>虹のスライドパズル</h1>
    <div class="spectrum" aria-hidden="true"></div>
    <p class="lede">マスをタップして空きマスへ滑らせ、元の並びに戻すパズルです。盤の幅や絵柄を決めて始めましょう。</p>
  </header>

  <div class="startBody">
    <div class="previewWrap">
      <div class="previewBox"><canvas id="preview" aria-label="完成図のプレビュー"></canvas></div>
      <p id="previewCap" class="cap">完成図 ・ 右下が空きマス</p>
    </div>

    <form id="setup" class="setup" novalidate>
      <div class="field">
        <label for="sizeInput" class="label">幅（マス数）</label>
        <div class="stepper">
          <button type="button" id="sizeDec" class="btn icon" aria-label="幅を1減らす">−</button>
          <input id="sizeInput" type="number" inputmode="numeric" min="2" step="1" value="4" aria-describedby="sizeNote">
          <button type="button" id="sizeInc" class="btn icon" aria-label="幅を1増やす">+</button>
        </div>
        <p id="sizeNote" class="note">4 × 4（動かすマスは15枚）</p>
      </div>

      <label class="switch" for="optNum">
        <input type="checkbox" id="optNum" checked>
        <span class="track" aria-hidden="true"></span>
        <span>数字を表示する</span>
      </label>
      <label class="switch" for="optHole">
        <input type="checkbox" id="optHole">
        <span class="track" aria-hidden="true"></span>
        <span>穴の位置をランダムにする</span>
      </label>

      <div class="field">
        <span class="label">絵柄</span>
        <div class="imgRow">
          <button type="button" id="importBtn" class="btn">画像をインポート</button>
          <button type="button" id="clearImg" class="btn icon" aria-label="画像を消す" disabled>✕</button>
        </div>
        <p id="imgNote" class="note imgName">虹のグラデーション（標準）</p>
        <button type="button" id="recropBtn" class="link" hidden>切り抜く範囲を調整する</button>
      </div>

      <button type="submit" class="btn primary big">開始</button>
    </form>
  </div>
</main>

<section id="game" class="game" hidden>
  <div class="hud">
    <button type="button" id="giveUp" class="btn small">諦める</button>
    <div class="stat"><span class="k">時間</span><span id="timer" class="v">00:00.0</span></div>
    <div class="stat"><span class="k">手数</span><span id="moves" class="v">0</span></div>
  </div>
  <div id="stage" class="stage">
    <canvas id="board" aria-label="パズル盤面" tabindex="0"></canvas>
    <p id="hint" class="hint">最初にマスを動かすとタイマーが始まります</p>
  </div>
  <div id="zoomBar" class="zoomBar" hidden>
    <button type="button" id="zoomOut" class="btn icon" aria-label="縮小">−</button>
    <input id="zoomRange" type="range" min="0" max="1000" value="0" aria-label="縮尺">
    <button type="button" id="zoomIn" class="btn icon" aria-label="拡大">+</button>
    <span id="zoomPct" class="pct">100%</span>
  </div>
</section>

<div id="cropModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
  <div class="sheet">
    <h2 id="cropTitle">切り抜く範囲を選ぶ</h2>
    <p class="note">枠の中がパズルになります。ドラッグで位置を、スライダーや2本指・ホイールで大きさを調整できます。</p>
    <div id="cropBox" class="cropBox"><canvas id="cropCanvas"></canvas></div>
    <div class="cropZoomRow">
      <span>小</span>
      <input id="cropZoom" type="range" min="0" max="1000" value="0" aria-label="切り抜きの拡大率">
      <span>大</span>
    </div>
    <div class="actions">
      <button type="button" id="cropCancel" class="btn">取り消す</button>
      <button type="button" id="cropOk" class="btn primary">この範囲で決定</button>
    </div>
  </div>
</div>

<div id="clearModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="clearTitle">
  <div class="sheet clear">
    <p id="clearSize" class="eyebrow">4 × 4</p>
    <h2 id="clearTitle">完成！</h2>
    <div class="bar" aria-hidden="true"></div>
    <dl class="results">
      <div><dt>かかった時間</dt><dd id="rTime">00:00.0</dd></div>
      <div><dt>手数</dt><dd id="rMoves">0</dd></div>
    </dl>
    <div class="points">
      <span class="k">ポイント</span>
      <span id="rPoints" class="pv">0</span>
      <span id="rBest" class="best"></span>
    </div>
    <p id="rFormula" class="formula"></p>
    <div class="actions">
      <button type="button" id="toStart" class="btn">開始画面に戻る</button>
      <button type="button" id="again" class="btn primary">もう一度する</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= settings ================= */
  const settings = { n: 4, showNum: true, randomHole: false };
  try {
    const s = JSON.parse(store.get('slide-settings') || 'null');
    if (s) {
      if (Number.isInteger(s.n) && s.n >= 2) settings.n = s.n;
      settings.showNum = !!s.showNum;
      settings.randomHole = !!s.randomHole;
    }
  } catch (e) {}

  // picture: { img, url, name, crop:{sx,sy,size}, square, canvas }
  let picture = null;

  /* ================= colors ================= */
  let theme = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    theme = {
      tray: cs.getPropertyValue('--tray').trim() || '#D3D9E5',
      stage: cs.getPropertyValue('--stage').trim() || '#E2E6EE'
    };
  }
  function hexToRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return [128, 128, 128];
    const v = parseInt(m[1], 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = k0 => { const k = (k0 + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  }
  // Rainbow: hue runs left→right (red to magenta), lightness falls top→bottom.
  function rainbowHSL(t, n) {
    const r = Math.floor(t / n), c = t % n;
    const u = n > 1 ? c / (n - 1) : 0, v = n > 1 ? r / (n - 1) : 0;
    return [u * 300, 82, 68 - v * 28];
  }

  /* ================= tile drawing ================= */
  function drawTile(ctx, t, x, y, s, n, img, showNum) {
    const g = s >= 24 ? Math.max(0.75, s * 0.025) : (s >= 8 ? 0.5 : 0);
    const rad = s >= 20 ? s * 0.09 : 0;
    const dx = x + g, dy = y + g, dw = s - 2 * g;
    ctx.beginPath();
    if (rad && ctx.roundRect) ctx.roundRect(dx, dy, dw, dw, rad); else ctx.rect(dx, dy, dw, dw);
    let light = false;
    if (img) {
      const ss = img.width / n;
      const r = Math.floor(t / n), c = t % n;
      ctx.save();
      ctx.clip();
      ctx.drawImage(img, c * ss, r * ss, ss, ss, x, y, s, s);
      ctx.restore();
    } else {
      const [h, sa, l] = rainbowHSL(t, n);
      ctx.fillStyle = `hsl(${h} ${sa}% ${l}%)`;
      ctx.fill();
      const [R, G, B] = hslToRgb(h, sa, l);
      light = (0.299 * R + 0.587 * G + 0.114 * B) / 255 > 0.62;
    }
    if (showNum && s >= 14) {
      const label = String(t + 1);
      let fs = Math.min(s * 0.4, 72);
      fs = Math.min(fs, (s * 0.82) / (label.length * 0.62));
      ctx.font = `700 ${fs}px "Chivo Mono", ui-monospace, Menlo, monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cx = x + s / 2, cy = y + s / 2 + fs * 0.04;
      if (img) {
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(2, fs * 0.22);
        ctx.strokeStyle = 'rgba(0,0,0,.65)';
        ctx.strokeText(label, cx, cy);
        ctx.fillStyle = '#FFFFFF';
      } else {
        ctx.fillStyle = light ? 'rgba(20,23,34,.86)' : '#FFFFFF';
      }
      ctx.fillText(label, cx, cy);
    }
  }

  /* ================= start screen ================= */
  const sizeInput = $('sizeInput'), sizeNote = $('sizeNote');
  const optNum = $('optNum'), optHole = $('optHole');
  sizeInput.value = settings.n;
  optNum.checked = settings.showNum;
  optHole.checked = settings.randomHole;

  function readSize() {
    const raw = sizeInput.value.trim();
    if (!/^\d+$/.test(raw)) return null;
    const n = Number(raw);
    return Number.isSafeInteger(n) && n >= 2 ? n : null;
  }
  function updateSizeNote() {
    const n = readSize();
    if (n === null) {
      sizeInput.setAttribute('aria-invalid', 'true');
      sizeNote.textContent = '幅は2以上の整数で入力してください。';
      sizeNote.className = 'note warn';
      return;
    }
    sizeInput.removeAttribute('aria-invalid');
    settings.n = n;
    let txt = `${n.toLocaleString('ja-JP')} × ${n.toLocaleString('ja-JP')}（動かすマスは${(n * n - 1).toLocaleString('ja-JP')}枚）`;
    let warn = false;
    if (n >= 2000) { txt += ' とても大きな盤面です。端末によっては開始できないことがあります。'; warn = true; }
    else if (n >= 100) { txt += ' 大きな盤面は動作が重くなることがあります。'; }
    sizeNote.textContent = txt;
    sizeNote.className = warn ? 'note warn' : 'note';
    drawPreview();
  }
  sizeInput.addEventListener('input', updateSizeNote);
  $('sizeDec').addEventListener('click', () => { sizeInput.value = Math.max(2, (readSize() || settings.n) - 1); updateSizeNote(); });
  $('sizeInc').addEventListener('click', () => { sizeInput.value = (readSize() || settings.n) + 1; updateSizeNote(); });
  optNum.addEventListener('change', () => { settings.showNum = optNum.checked; drawPreview(); });
  optHole.addEventListener('change', () => { settings.randomHole = optHole.checked; drawPreview(); });

  // preview
  const preview = $('preview'), pctx = preview.getContext('2d');
  function drawPreview() {
    const rect = preview.getBoundingClientRect();
    const size = Math.max(1, Math.round(rect.width));
    if (!rect.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    preview.width = preview.height = Math.round(size * dpr);
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, size, size);
    const n = settings.n, s = size / n;
    const img = picture ? picture.canvas : null;
    if (s >= 2.5 && n <= 160) {
      const N2 = n * n;
      for (let t = 0; t < N2; t++) {
        if (!settings.randomHole && t === N2 - 1) continue;
        drawTile(pctx, t, (t % n) * s, Math.floor(t / n) * s, s, n, img, settings.showNum);
      }
    } else if (img) {
      pctx.imageSmoothingQuality = 'high';
      pctx.drawImage(img, 0, 0, size, size);
    } else {
      const k = 48, c = document.createElement('canvas');
      c.width = c.height = k;
      const cx = c.getContext('2d');
      for (let t = 0; t < k * k; t++) {
        const [h, sa, l] = rainbowHSL(t, k);
        cx.fillStyle = `hsl(${h} ${sa}% ${l}%)`;
        cx.fillRect(t % k, Math.floor(t / k), 1, 1);
      }
      pctx.imageSmoothingEnabled = true;
      pctx.drawImage(c, 0, 0, size, size);
    }
    $('previewCap').textContent = settings.randomHole
      ? '完成図 ・ 空きマスの位置は開始時にランダムで決まります'
      : '完成図 ・ 右下が空きマス';
  }

  // image import
  const fileInput = $('fileInput');
  $('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      if (w === h) {
        setPicture({ img, url, name: f.name, square: true, crop: { sx: 0, sy: 0, size: w } });
      } else {
        openCrop({ img, url, name: f.name, square: false }, null);
      }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      const note = $('imgNote');
      note.textContent = 'この画像は読み込めませんでした。JPEG・PNG・WebP などの画像を選んでください。';
      note.className = 'note warn imgName';
    };
    img.src = url;
  });
  $('clearImg').addEventListener('click', () => {
    if (picture) URL.revokeObjectURL(picture.url);
    picture = null;
    updateImgUI();
  });
  $('recropBtn').addEventListener('click', () => { if (picture) openCrop(picture, picture.crop); });

  function setPicture(p) {
    const { img, crop } = p;
    const out = Math.max(1, Math.min(2048, Math.round(crop.size)));
    const c = document.createElement('canvas');
    c.width = c.height = out;
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, crop.sx, crop.sy, crop.size, crop.size, 0, 0, out, out);
    if (picture && picture.url !== p.url) URL.revokeObjectURL(picture.url);
    picture = { ...p, canvas: c };
    updateImgUI();
  }
  function updateImgUI() {
    const note = $('imgNote');
    note.className = 'note imgName';
    note.textContent = picture ? `画像：${picture.name}` : '虹のグラデーション（標準）';
    $('clearImg').disabled = !picture;
    $('recropBtn').hidden = !picture || picture.square;
    drawPreview();
  }

  $('setup').addEventListener('submit', e => {
    e.preventDefault();
    const n = readSize();
    if (n === null) { updateSizeNote(); sizeInput.focus(); return; }
    settings.n = n;
    store.set('slide-settings', JSON.stringify(settings));
    startGame();
  });

  /* ================= crop ================= */
  const cropCanvas = $('cropCanvas'), cctx = cropCanvas.getContext('2d');
  const crop = { p: null, W: 0, F: 0, m: 0, s: 1, minS: 1, maxS: 5, ix: 0, iy: 0 };
  function openCrop(p, prev) {
    crop.p = p;
    $('cropModal').hidden = false;
    const W = $('cropBox').getBoundingClientRect().width;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cropCanvas.width = cropCanvas.height = Math.round(W * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    crop.W = W; crop.F = W * 0.84; crop.m = (W - crop.F) / 2;
    const iw = p.img.naturalWidth, ih = p.img.naturalHeight;
    crop.minS = crop.F / Math.min(iw, ih);
    crop.maxS = crop.minS * 6;
    if (prev) {
      crop.s = clamp(crop.F / prev.size, crop.minS, crop.maxS);
      crop.ix = crop.m - prev.sx * crop.s;
      crop.iy = crop.m - prev.sy * crop.s;
    } else {
      crop.s = crop.minS;
      crop.ix = (W - iw * crop.s) / 2;
      crop.iy = (W - ih * crop.s) / 2;
    }
    clampCrop(); syncCropSlider(); drawCrop();
    $('cropOk').focus();
  }
  function clampCrop() {
    const iw = crop.p.img.naturalWidth * crop.s, ih = crop.p.img.naturalHeight * crop.s;
    crop.ix = clamp(crop.ix, crop.m + crop.F - iw, crop.m);
    crop.iy = clamp(crop.iy, crop.m + crop.F - ih, crop.m);
  }
  function drawCrop() {
    const { W, F, m } = crop;
    const img = crop.p.img;
    cctx.clearRect(0, 0, W, W);
    cctx.fillStyle = theme.stage;
    cctx.fillRect(0, 0, W, W);
    cctx.imageSmoothingQuality = 'high';
    cctx.drawImage(img, crop.ix, crop.iy, img.naturalWidth * crop.s, img.naturalHeight * crop.s);
    cctx.beginPath();
    cctx.rect(0, 0, W, W);
    cctx.rect(m, m, F, F);
    cctx.fillStyle = 'rgba(0,0,0,.55)';
    cctx.fill('evenodd');
    const n = settings.n;
    if (n <= 16) {
      cctx.strokeStyle = 'rgba(255,255,255,.35)';
      cctx.lineWidth = 1;
      cctx.beginPath();
      for (let i = 1; i < n; i++) {
        const o = m + (F * i) / n;
        cctx.moveTo(o, m); cctx.lineTo(o, m + F);
        cctx.moveTo(m, o); cctx.lineTo(m + F, o);
      }
      cctx.stroke();
    }
    cctx.strokeStyle = '#FFFFFF';
    cctx.lineWidth = 2;
    cctx.strokeRect(m, m, F, F);
  }
  function cropZoomAt(ns, px, py) {
    ns = clamp(ns, crop.minS, crop.maxS);
    const bx = (px - crop.ix) / crop.s, by = (py - crop.iy) / crop.s;
    crop.s = ns; crop.ix = px - bx * ns; crop.iy = py - by * ns;
    clampCrop(); syncCropSlider(); drawCrop();
  }
  function syncCropSlider() {
    $('cropZoom').value = Math.round(Math.log(crop.s / crop.minS) / Math.log(crop.maxS / crop.minS) * 1000);
  }
  $('cropZoom').addEventListener('input', e => {
    const v = Number(e.target.value) / 1000;
    const c = crop.W / 2;
    cropZoomAt(crop.minS * Math.pow(crop.maxS / crop.minS, v), c, c);
  });
  $('cropCancel').addEventListener('click', () => {
    if (!picture || picture.url !== crop.p.url) URL.revokeObjectURL(crop.p.url);
    $('cropModal').hidden = true;
  });
  $('cropOk').addEventListener('click', () => {
    const size = crop.F / crop.s;
    const sx = (crop.m - crop.ix) / crop.s, sy = (crop.m - crop.iy) / crop.s;
    setPicture({ img: crop.p.img, url: crop.p.url, name: crop.p.name, square: false, crop: { sx, sy, size } });
    $('cropModal').hidden = true;
  });
  attachGestures(cropCanvas, {
    getPan: () => ({ x: crop.ix, y: crop.iy }),
    setPan: (x, y) => { crop.ix = x; crop.iy = y; clampCrop(); drawCrop(); },
    getScale: () => crop.s,
    zoomAt: cropZoomAt,
    pinch: (g, scale, mx, my) => {
      const ns = clamp(g.scale * scale, crop.minS, crop.maxS);
      const bx = (g.mx - g.px) / g.scale, by = (g.my - g.py) / g.scale;
      crop.s = ns; crop.ix = mx - bx * ns; crop.iy = my - by * ns;
      clampCrop(); syncCropSlider(); drawCrop();
    },
    tap: null
  });

  /* ================= gestures (shared) ================= */
  function attachGestures(el, h) {
    const pts = new Map();
    let g = null;
    const at = e => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const pinchStart = () => {
      const [a, b] = [...pts.values()];
      const pan = h.getPan();
      return { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, scale: h.getScale(), px: pan.x, py: pan.y };
    };
    const panStart = p => { const pan = h.getPan(); return { type: 'pan', sx: p.x, sy: p.y, px: pan.x, py: pan.y }; };
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      const p = at(e);
      pts.set(e.pointerId, p);
      if (pts.size === 1) { g = panStart(p); g.type = 'tap'; }
      else if (pts.size === 2) g = pinchStart();
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const p = at(e);
      pts.set(e.pointerId, p);
      if (!g) return;
      if (g.type === 'tap' && Math.hypot(p.x - g.sx, p.y - g.sy) > 8) g.type = 'pan';
      if (g.type === 'pan' && pts.size === 1) {
        h.setPan(g.px + (p.x - g.sx), g.py + (p.y - g.sy));
      } else if (g.type === 'pinch' && pts.size >= 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        h.pinch(g, d / g.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
      }
    });
    const end = e => {
      if (!pts.has(e.pointerId)) return;
      const p = at(e);
      const wasTap = g && g.type === 'tap' && pts.size === 1 && e.type === 'pointerup';
      pts.delete(e.pointerId);
      if (wasTap && h.tap) h.tap(p.x, p.y);
      if (pts.size === 1) g = panStart([...pts.values()][0]);
      else if (pts.size === 0) g = null;
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', e => {
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
      const f = Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015));
      const p = at(e);
      h.zoomAt(h.getScale() * f, p.x, p.y);
    }, { passive: false });
  }
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ================= game ================= */
  const game = { n: 0, tiles: null, holeId: 0, holePos: 0, moves: 0, t0: 0, elapsed: 0, running: false, solved: false, wrong: 0, anim: null, img: null, showNum: true };
  const cam = { cell: 40, ox: 0, oy: 0, fit: 0, min: 1, max: 100, w: 0, h: 0, dpr: 1 };
  const ZOOM_NEED = 40;   // below this fitted cell size (CSS px) the zoom bar appears
  const PIXEL_MODE = 5;   // below this cell size the board is drawn one pixel per tile
  const board = $('board'), bctx = board.getContext('2d');
  const stage = $('stage');
  let pixel = null, avg = null;
  let timerId = 0;

  function shuffle(n, holeId) {
    const N2 = n * n;
    const a = new Int32Array(N2);
    let wrong = 0;
    do {
      for (let i = 0; i < N2; i++) a[i] = i;
      for (let i = N2 - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      // permutation parity via cycle count
      const seen = new Uint8Array(N2);
      let cycles = 0, holePos = 0;
      for (let i = 0; i < N2; i++) {
        if (a[i] === holeId) holePos = i;
        if (seen[i]) continue;
        cycles++;
        let j = i;
        while (!seen[j]) { seen[j] = 1; j = a[j]; }
      }
      const permParity = (N2 - cycles) & 1;
      const dist = Math.abs(Math.floor(holePos / n) - Math.floor(holeId / n)) + Math.abs((holePos % n) - (holeId % n));
      if (permParity !== (dist & 1)) {
        // swap two non-hole tiles to make it solvable
        let p1 = -1, p2 = -1;
        for (let i = 0; i < N2 && p2 < 0; i++) {
          if (a[i] === holeId) continue;
          if (p1 < 0) p1 = i; else p2 = i;
        }
        const t = a[p1]; a[p1] = a[p2]; a[p2] = t;
      }
      wrong = 0;
      for (let i = 0; i < N2; i++) if (a[i] !== i) wrong++;
    } while (wrong === 0);
    return a;
  }

  function startGame() {
    const n = settings.n, N2 = n * n;
    if (N2 > 2 ** 27) { sizeError(); return; }
    const holeId = settings.randomHole ? Math.floor(Math.random() * N2) : N2 - 1;
    let tiles;
    try { tiles = shuffle(n, holeId); } catch (e) { sizeError(); return; }
    stopTimer();
    Object.assign(game, {
      n, tiles, holeId, holePos: tiles.indexOf(holeId), moves: 0, t0: 0, elapsed: 0,
      running: false, solved: false, anim: null, img: picture ? picture.canvas : null, showNum: settings.showNum
    });
    let wrong = 0;
    for (let i = 0; i < N2; i++) if (tiles[i] !== i) wrong++;
    game.wrong = wrong;
    pixel = null; avg = null;
    $('timer').textContent = fmt(0);
    $('moves').textContent = '0';
    $('hint').hidden = false;
    $('clearModal').hidden = true;
    showScreen('game');
    cam.fit = 0;
    layout(false);
    board.focus({ preventScroll: true });
  }
  function sizeError() {
    sizeNote.textContent = 'この幅は大きすぎて、この端末では盤面を用意できませんでした。幅を小さくしてください。';
    sizeNote.className = 'note warn';
  }

  function showScreen(which) {
    $('start').hidden = which !== 'start';
    $('game').hidden = which !== 'game';
    document.body.classList.toggle('playing', which === 'game');
    if (which === 'start') { window.scrollTo(0, 0); drawPreview(); }
  }

  function layout(keep) {
    if ($('game').hidden) return;
    const r = stage.getBoundingClientRect();
    const w = r.width, h = r.height;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const center = keep && cam.fit ? { x: (cam.w / 2 - cam.ox) / cam.cell, y: (cam.h / 2 - cam.oy) / cam.cell, z: cam.cell / cam.fit } : null;
    board.width = Math.round(w * dpr);
    board.height = Math.round(h * dpr);
    cam.w = w; cam.h = h; cam.dpr = dpr;
    const n = game.n;
    cam.fit = Math.max(1e-4, (Math.min(w, h) - 16) / n);
    cam.min = cam.fit;
    cam.max = cam.fit < ZOOM_NEED ? Math.max(72, cam.fit) : cam.fit * 2.5;
    $('zoomBar').hidden = !(cam.fit < ZOOM_NEED);
    if (center) {
      cam.cell = clamp(cam.fit * center.z, cam.min, cam.max);
      cam.ox = w / 2 - center.x * cam.cell;
      cam.oy = h / 2 - center.y * cam.cell;
    } else {
      cam.cell = cam.fit;
    }
    clampCam();
    updateZoomUI();
    draw();
  }
  function clampCam() {
    const B = game.n * cam.cell, pad = 8;
    cam.ox = B <= cam.w - 2 * pad ? (cam.w - B) / 2 : clamp(cam.ox, cam.w - B - pad, pad);
    cam.oy = B <= cam.h - 2 * pad ? (cam.h - B) / 2 : clamp(cam.oy, cam.h - B - pad, pad);
  }
  function zoomAt(nc, px, py) {
    nc = clamp(nc, cam.min, cam.max);
    const bx = (px - cam.ox) / cam.cell, by = (py - cam.oy) / cam.cell;
    cam.cell = nc; cam.ox = px - bx * nc; cam.oy = py - by * nc;
    clampCam(); updateZoomUI(); requestDraw();
  }
  function updateZoomUI() {
    const span = Math.log(cam.max / cam.min);
    $('zoomRange').value = span > 0 ? Math.round(Math.log(cam.cell / cam.min) / span * 1000) : 0;
    $('zoomPct').textContent = Math.round(cam.cell / cam.fit * 100) + '%';
  }
  $('zoomRange').addEventListener('input', e => {
    const v = Number(e.target.value) / 1000;
    zoomAt(cam.min * Math.pow(cam.max / cam.min, v), cam.w / 2, cam.h / 2);
  });
  $('zoomIn').addEventListener('click', () => zoomAt(cam.cell * 1.3, cam.w / 2, cam.h / 2));
  $('zoomOut').addEventListener('click', () => zoomAt(cam.cell / 1.3, cam.w / 2, cam.h / 2));

  attachGestures(board, {
    getPan: () => ({ x: cam.ox, y: cam.oy }),
    setPan: (x, y) => { cam.ox = x; cam.oy = y; clampCam(); requestDraw(); },
    getScale: () => cam.cell,
    zoomAt,
    pinch: (g, scale, mx, my) => {
      const nc = clamp(g.scale * scale, cam.min, cam.max);
      const bx = (g.mx - g.px) / g.scale, by = (g.my - g.py) / g.scale;
      cam.cell = nc; cam.ox = mx - bx * nc; cam.oy = my - by * nc;
      clampCam(); updateZoomUI(); requestDraw();
    },
    tap: (x, y) => {
      if (game.solved) return;
      const c = Math.floor((x - cam.ox) / cam.cell), r = Math.floor((y - cam.oy) / cam.cell);
      if (r < 0 || c < 0 || r >= game.n || c >= game.n) return;
      tryMove(r * game.n + c);
    }
  });

  document.addEventListener('keydown', e => {
    if ($('game').hidden || game.solved || !$('clearModal').hidden) return;
    const n = game.n, h = game.holePos, hr = Math.floor(h / n), hc = h % n;
    let p = -1;
    if (e.key === 'ArrowUp' && hr < n - 1) p = h + n;
    else if (e.key === 'ArrowDown' && hr > 0) p = h - n;
    else if (e.key === 'ArrowLeft' && hc < n - 1) p = h + 1;
    else if (e.key === 'ArrowRight' && hc > 0) p = h - 1;
    else return;
    e.preventDefault();
    tryMove(p);
  });

  function colorOf(t) {
    if (avg) return [avg[t * 4], avg[t * 4 + 1], avg[t * 4 + 2]];
    const [h, s, l] = rainbowHSL(t, game.n);
    return hslToRgb(h, s, l);
  }
  function ensurePixel() {
    if (pixel) return pixel;
    const n = game.n;
    if (n > 8192) return null;
    try {
      if (game.img && !avg) {
        const t = document.createElement('canvas');
        t.width = t.height = n;
        const tx = t.getContext('2d');
        tx.imageSmoothingQuality = 'high';
        tx.drawImage(game.img, 0, 0, n, n);
        avg = tx.getImageData(0, 0, n, n).data;
      }
      const c = document.createElement('canvas');
      c.width = c.height = n;
      const x = c.getContext('2d');
      const id = x.createImageData(n, n), d = id.data;
      const hole = hexToRgb(theme.tray);
      for (let pos = 0, N2 = n * n; pos < N2; pos++) {
        const t = game.tiles[pos];
        const rgb = (t === game.holeId && !game.solved) ? hole : colorOf(t);
        d[pos * 4] = rgb[0]; d[pos * 4 + 1] = rgb[1]; d[pos * 4 + 2] = rgb[2]; d[pos * 4 + 3] = 255;
      }
      x.putImageData(id, 0, 0);
      pixel = { c, x };
      return pixel;
    } catch (e) { return null; }
  }
  function setPixel(pos, rgb) {
    if (!pixel) return;
    pixel.x.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
    pixel.x.fillRect(pos % game.n, Math.floor(pos / game.n), 1, 1);
  }

  function tryMove(pos) {
    const n = game.n, h = game.holePos;
    const pr = Math.floor(pos / n), pc = pos % n, hr = Math.floor(h / n), hc = h % n;
    if (Math.abs(pr - hr) + Math.abs(pc - hc) !== 1) return false;
    const T = game.tiles, t = T[pos];
    const before = (T[pos] !== pos) + (T[h] !== h);
    T[h] = t; T[pos] = game.holeId;
    const after = (T[pos] !== pos) + (T[h] !== h);
    game.wrong += after - before;
    game.holePos = pos;
    game.moves++;
    if (game.moves === 1) { startTimer(); $('hint').hidden = true; }
    $('moves').textContent = game.moves.toLocaleString('ja-JP');
    game.anim = { tile: t, from: pos, to: h, t0: performance.now(), dur: reduceMotion ? 0 : 110 };
    if (pixel) { setPixel(h, colorOf(t)); setPixel(pos, hexToRgb(theme.tray)); }
    if (game.wrong === 0) finish();
    requestDraw();
    return true;
  }

  function finish() {
    stopTimer();
    game.solved = true;
    if (pixel) setPixel(game.holePos, colorOf(game.holeId));
    setTimeout(showClear, reduceMotion ? 150 : 550);
  }

  /* ---------- timer ---------- */
  const pad2 = v => String(v).padStart(2, '0');
  function fmt(sec) {
    const t = Math.floor(sec * 10);
    const ds = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600) % 60, h = Math.floor(t / 36000);
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(s) + '.' + ds;
  }
  function tick() {
    game.elapsed = (performance.now() - game.t0) / 1000;
    $('timer').textContent = fmt(game.elapsed);
  }
  function startTimer() { game.t0 = performance.now(); game.running = true; clearInterval(timerId); timerId = setInterval(tick, 100); }
  function stopTimer() { if (game.running) tick(); game.running = false; clearInterval(timerId); }

  /* ---------- score ---------- */
  // Par moves and time grow with the board (≈ n³). Each rating is 1.00 at par,
  // approaches 2.00 when far quicker, and falls toward 0 when slower.
  function score(n, moves, secs) {
    const parMoves = 2.5 * n ** 3;
    const parTime = Math.max(parMoves * 0.6, 10);
    const base = 1000 * (n * n - 1);
    const mf = 2 / (1 + moves / parMoves);
    const tf = 2 / (1 + secs / parTime);
    return { points: Math.round(base * (mf + tf) / 2), base, mf, tf };
  }

  function showClear() {
    if (!game.solved || $('game').hidden) return;
    const n = game.n;
    const sc = score(n, game.moves, game.elapsed);
    $('clearSize').textContent = `${n.toLocaleString('ja-JP')} × ${n.toLocaleString('ja-JP')}`;
    $('rTime').textContent = fmt(game.elapsed);
    $('rMoves').textContent = game.moves.toLocaleString('ja-JP');
    $('rPoints').textContent = sc.points.toLocaleString('ja-JP');
    $('rFormula').textContent = `基礎点 ${sc.base.toLocaleString('ja-JP')}（盤の大きさ）×（手数評価 ${sc.mf.toFixed(2)} ＋ 時間評価 ${sc.tf.toFixed(2)}）÷ 2`;
    const key = 'slide-best-' + n;
    const prev = Number(store.get(key) || 0);
    const best = $('rBest');
    if (sc.points > prev) {
      store.set(key, String(sc.points));
      best.textContent = prev ? `自己ベスト更新（前回 ${prev.toLocaleString('ja-JP')}）` : 'この幅での初クリア';
      best.className = 'best new';
    } else {
      best.textContent = `この幅の自己ベスト ${prev.toLocaleString('ja-JP')}`;
      best.className = 'best';
    }
    $('clearModal').hidden = false;
    $('again').focus();
  }

  $('giveUp').addEventListener('click', () => {
    stopTimer();
    game.solved = true;
    $('clearModal').hidden = true;
    showScreen('start');
  });
  $('toStart').addEventListener('click', () => { $('clearModal').hidden = true; showScreen('start'); });
  $('again').addEventListener('click', () => { $('clearModal').hidden = true; startGame(); });

  /* ---------- rendering ---------- */
  let drawQueued = false;
  function requestDraw() {
    if (drawQueued) return;
    drawQueued = true;
    requestAnimationFrame(() => { drawQueued = false; draw(); });
  }
  function draw() {
    if ($('game').hidden || !game.tiles) return;
    const { w, h, dpr } = cam;
    const ctx = bctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = theme.stage;
    ctx.fillRect(0, 0, w, h);
    const n = game.n, s = cam.cell, B = n * s;
    ctx.fillStyle = theme.tray;
    ctx.fillRect(cam.ox, cam.oy, B, B);

    if (s < PIXEL_MODE) {
      const p = ensurePixel();
      if (p) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(p.c, cam.ox, cam.oy, B, B);
        ctx.imageSmoothingEnabled = true;
      }
      game.anim = null;
      return;
    }

    const c0 = Math.max(0, Math.floor(-cam.ox / s)), c1 = Math.min(n - 1, Math.floor((w - cam.ox) / s));
    const r0 = Math.max(0, Math.floor(-cam.oy / s)), r1 = Math.min(n - 1, Math.floor((h - cam.oy) / s));
    const a = game.anim;
    const T = game.tiles, img = game.img, showNum = game.showNum;
    for (let r = r0; r <= r1; r++) {
      const y = cam.oy + r * s;
      for (let c = c0; c <= c1; c++) {
        const t = T[r * n + c];
        if (t === game.holeId && !game.solved) continue;
        if (a && t === a.tile) continue;
        drawTile(ctx, t, cam.ox + c * s, y, s, n, img, showNum);
      }
    }
    if (a) {
      const p = a.dur ? Math.min(1, (performance.now() - a.t0) / a.dur) : 1;
      const e = 1 - Math.pow(1 - p, 3);
      const fr = Math.floor(a.from / n), fc = a.from % n, tr = Math.floor(a.to / n), tc = a.to % n;
      drawTile(ctx, a.tile, cam.ox + (fc + (tc - fc) * e) * s, cam.oy + (fr + (tr - fr) * e) * s, s, n, img, showNum);
      if (p < 1) requestDraw(); else game.anim = null;
    }
  }

  /* ================= wiring ================= */
  new ResizeObserver(() => layout(true)).observe(stage);
  new ResizeObserver(() => drawPreview()).observe(preview);
  function onTheme() {
    readTheme();
    pixel = null;
    requestDraw();
    drawPreview();
    if (!$('cropModal').hidden && crop.p) drawCrop();
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawPreview(); requestDraw(); });

  readTheme();
  updateSizeNote();
  updateImgUI();
})();
</script>

</body></html>
